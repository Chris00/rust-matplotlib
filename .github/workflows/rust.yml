name: Cargo Build & Test
on: [push, pull_request]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [stable, beta, nightly, anaconda linux, macos, anaconda macos, win64]
        include:
          - build: stable
            os: ubuntu-latest
            rust: stable
          - build: beta
            os: ubuntu-latest
            rust: beta
          - build: nightly
            os: ubuntu-latest
            rust: nightly
          - build: anaconda linux
            os: ubuntu-latest
            rust: stable
          - build: macos
            os: macos-latest
            rust: stable
          - build: anaconda macos
            os: macos-latest
            rust: nightly
          - build: win64
            os: windows-latest
            rust: stable
    steps:
    - uses: actions/checkout@master
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
      if: ${{ ! startsWith(matrix.build, 'anaconda') }}
    - name: Install Matplotlib (pip)
      run: python3 -m pip install -U matplotlib
      if: ${{ ! startsWith(matrix.build, 'anaconda') }}
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      if: startsWith(matrix.build, 'anaconda macos')
    - name: Install Matplotlib (Anaconda)
      run: $CONDA/bin/conda install conda-forge::matplotlib
      if: startsWith(matrix.build, 'anaconda')
    - name: Install Rust ${{ matrix.rust }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
    - run: cargo build
      if: ${{ ! startsWith(matrix.build, 'anaconda') }}
    - run: cargo test
      if: ${{ ! startsWith(matrix.build, 'anaconda') }}
    - run: cargo run --example a_simple_example
      if: ${{ ! startsWith(matrix.build, 'anaconda') }}
    - name: Run example with Anaconda
      if: startsWith(matrix.build, 'anaconda')
      shell: bash
      run: |
        eval "$($CONDA/bin/conda shell.bash activate)"
        mkdir -p target/debug/deps
        ln -s $CONDA_PREFIX/lib/libpython* target/debug/deps
        cargo run --example a_simple_example
